# tatara-lisp ships its standalone CLI (`tatara-script`) as a
# cross-arch GitHub Release on every `v*` tag. That is ALL this workflow
# publishes.
#
# ── NO REGISTRY IMAGE (removed 2026-09-15) ───────────────────────────
# This workflow used to also push a Docker image to ghcr.io/pleme-io/
# tatara-script. It was removed on purpose: tatara-lisp is an open-source
# crates.io package, and a registry image dragged a write credential into
# its release path for no consumer that needed it. The image job had been
# failing on a GHCR 403 ("token does not match expected scopes") on every
# tag, runs 34003170242 and 34977927798.
#
# The IMAGE DERIVATION is deliberately kept: flake.nix `packages.image` is
# what pleme-io/actions builds its action images from, through nix
# (actions/flake.nix `baseImage = tatara-lisp.packages.${system}.image`),
# with no registry in the path. Removing the publish job changes nothing for
# that consumer; removing the derivation would break it.

name: release-binaries

on:
  push:
    tags: ['v*']

jobs:
  binaries:
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: tatara-script
      # musl: a fully static binary with NO libc floor.
      #
      # The gnu-linked releases carry, as a hard floor, the glibc of whatever
      # runner built them. Measured on the published v0.3.37 asset: it
      # requires GLIBC_2.39, so it cannot run on ubuntu-22.04 (2.35) — and
      # repos pin 22.04 for real reasons (kind, gateway compatibility).
      #
      # That floor is not a detail, it is what pins the whole fleet to an old
      # tatara-script. pleme-io/actions is on v0.2.5 and cannot move: v0.2.5
      # predates the lint unbound-symbol rule (v0.3.23), so tlisp-lint's
      # layer 3 is structurally unable to check — it certified "clean" for a
      # month — and bumping to a gnu v0.3.x would instead break every
      # 22.04 consumer. Both directions blocked, by the linker.
      #
      # Static musl removes the floor entirely and runs anywhere, which is
      # what makes that pin bump safe and lets the gate be armed to fail
      # closed. Lower the floor at the LINKER, never by downgrading the
      # runner that builds it — the build toolchain is itself tatara-script,
      # so a downgraded build runner just breaks the release outright.
      #
      # v0.3.41 then red-failed the gate that enforces all of the above, on an
      # artifact that was correct: rustc emits *-linux-musl as static-PIE, and
      # the gate was grepping file(1) for the literal 'statically linked' while
      # file(1) says 'static-pie linked' for that shape. The published asset had
      # zero GLIBC_* imports and the step directly above had just run it on
      # ubuntu-22.04. Fixed in substrate (rust-binary-release.yml) by asserting
      # the ELF fact — no PT_INTERP, no versioned GLIBC_* imports — rather than
      # one tool's wording for it. Nothing about this repo's musl choice moved.
      linux-libc: musl
