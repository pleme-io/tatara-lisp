[package]
name = "tatara-lisp"
description = "Homoiconic S-expression reader + macroexpander — the pleme-io Lisp authoring surface, hermetic-build standalone"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Exact-pinned in [workspace.dependencies] — see the seal comment there.
# Inheriting is what puts the pin where rust-workspace-bump can maintain
# it; declared inline here it sat stale at 0.2.2 for three releases.
tatara-lisp-derive.workspace = true
# The INVERTed edge (phase 2). `domain::suggest` lives in tatara-closed-set,
# its only consumer, and is re-exported from `domain` here so
# `tatara_lisp::domain::suggest` keeps resolving. This direction is what
# lets step 2 land LispError variants carrying ClosedSet payloads.
tatara-closed-set.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"

[features]
default = []

[dev-dependencies]
# PINNED EXACTLY, and the pin is what makes "canonical" well-defined.
#
# Measured 2026-08-04: the installed `feira` CLI ships caixa-fmt 0.1.5, while
# `0.1` resolved to 0.1.7 — and the two DISAGREE on canonical form for 2 of
# this repo's 4 lisp files. An unpinned gate therefore rejects files the
# developer's own `feira fmt` just produced, which trains people to disable
# the gate rather than use it. Bump this in lockstep with the CLI, never alone.
caixa-fmt = "=0.1.5"
