[package]
name = "tatara-lisp"
description = "Homoiconic S-expression reader + macroexpander — the pleme-io Lisp authoring surface, hermetic-build standalone"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Exact-pinned in [workspace.dependencies] — see the seal comment there.
# Inheriting is what puts the pin where rust-workspace-bump can maintain
# it; declared inline here it sat stale at 0.2.2 for three releases.
tatara-lisp-derive.workspace = true
# The INVERTed edge (phase 2). `domain::suggest` lives in tatara-closed-set,
# its only consumer, and is re-exported from `domain` here so
# `tatara_lisp::domain::suggest` keeps resolving. This direction is what
# lets step 2 land LispError variants carrying ClosedSet payloads.
tatara-closed-set.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"

[features]
default = []

# NO caixa-fmt DEV-DEP — it made this crate UNPUBLISHABLE.
#
# caixa-fmt depends on `tatara-lisp ^0.3.26`, which resolves to the PUBLISHED
# tatara-lisp 0.3.26, which pins `tatara-lisp-derive = "=0.3.26"`. This crate
# pins `= <own version>`. One graph, two exact pins on the same crate, no
# solution — `cargo package` fails with "all possible versions conflict".
#
# Local builds never saw it: the workspace `[patch.crates-io]` collapses the
# duplicate. `cargo package` IGNORES patches, so the cycle only ever appeared
# at publish time, which is why the release was red while every build was green.
#
# The gate did not move, only its home: tatara-kanmon runs the identical
# caixa-fmt check in build.rs, is `publish = false`, and now owns
# tests/canonical_corpus.rs (including the `--ignored reformat` fixer). Nothing
# is un-gated by this; a crate that cannot publish is the thing being fixed.
