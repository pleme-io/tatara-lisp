[workspace]
members = [
    # Not a `tatara-*` crate, on purpose: monosashi is lisp-AGNOSTIC. It is a
    # member here because `blue` already resolves three crates from this one
    # git source at one rev, so a fourth member costs no new repo — and
    # because the vocabulary must sit BELOW both lisps (blue depends on
    # tatara-lisp, so tatara-lisp cannot depend on blue). It takes no
    # dependency on any other member.
    "monosashi",
    # Same structural position as monosashi — zero dependencies, BELOW every
    # lisp — different subject: monosashi measures, kumihan composes. It has to
    # sit here because `caixa-fmt` depends back on published tatara-lisp, so a
    # shared pretty-printing algebra placed in tatara-lisp, blue-lang-fmt or
    # caixa-fmt is a cycle from at least one direction.
    "kumihan",
    "tatara",
    "tatara-cilium",
    "tatara-closed-set",
    "tatara-closed-set-derive",
    "tatara-doc",
    "tatara-domain-forge",
    "tatara-ebpf",
    "tatara-env",
    "tatara-gateway-api",
    # Not a library — the build gate that makes canonical formatting a
    # compile-time property of this workspace. Nothing depends on it; it works
    # by being built. See tatara-kanmon/build.rs.
    "tatara-kanmon",
    "tatara-keywords",
    "tatara-lisp",
    "tatara-lisp-derive",
    "tatara-lisp-eval",
    "tatara-lisp-lint",
    "tatara-lisp-script",
    "tatara-lisp-source",
    "tatara-platform-checks",
    "tatara-prometheus-operator",
    "tatara-render",
    "tatara-rollout",
]
resolver = "3"

[workspace.package]
version = "0.3.53"
edition = "2021"
rust-version = "1.97.0"
authors = ["Pleme.io <engineering@pleme.io>"]
license = "MIT"
repository = "https://github.com/pleme-io/tatara-lisp"
homepage = "https://github.com/pleme-io/tatara-lisp"
readme = "README.md"
categories = ["compilers", "command-line-interface"]
keywords = ["tatara", "lisp", "pleme-io", "scripting", "tlisp"]

[workspace.dependencies]
# ── THE lib↔derive SEAL. Do not loosen this to a caret. ───────────────
#
# `tatara-lisp-derive` EMITS calls into `tatara-lisp` (`::tatara_lisp::
# domain::…`), so the two are one artifact wearing two crate names. A
# caret requirement lets them drift apart, and drift here is not
# theoretical — it is the split-brain this fleet just spent a
# consolidation on. Reproduced:
#
#   $ cargo update -p tatara-lisp-derive       # against published 0.2.4,
#     Updating tatara-lisp-derive 0.2.2 -> 0.2.154   # whose req is caret
#   error[E0425]: cannot find function `parse_kwargs_strict`
#                 in module `tatara_lisp::domain`
#     --> tatara-lisp-0.2.4/src/compiler_spec.rs:47
#
# i.e. the published crate could not compile ITSELF. Consumers papered
# over it by hand-copying an exact-pin comment block into their own
# Cargo.toml (banken carried 12 lines of it; 5+ repos duplicated it) —
# the same fix N times, which the PRIME DIRECTIVE calls a bug. It
# belongs here, once.
#
# This is the serde shape (`serde` exact-pins `serde_derive`): the lib
# owns the pairing, so a consumer depends ONLY on `tatara-lisp` and uses
# the `DeriveTataraDomain` re-export (lib.rs) — never naming the derive
# and therefore never able to mispair it.
#
# Living HERE is load-bearing, not cosmetic: pleme-io/actions'
# rust-workspace-bump rewrites intra-workspace pins ONLY inside
# [workspace.dependencies] (rewrite-pins-walk), which is precisely why
# the old pin sat stale at 0.2.2 while the workspace moved to 0.2.5.
# The bumper preserves the `=` prefix as of actions@2a7e8f1 (proved by a
# fail-once test); before that fix this pin would have silently decayed
# back to a caret on the next release.
tatara-lisp-derive = { path = "tatara-lisp-derive", version = "=0.3.53" }

# The SAME seal, for the SAME reason, on the closed-set pair: this derive
# emits `::tatara_closed_set::ClosedSet` paths, so lib and derive are one
# artifact wearing two crate names and a caret would let them drift into
# exactly the "the published crate cannot compile itself" failure recorded
# above. `=`, not caret. The bumper preserves it (actions@2a7e8f1).
tatara-closed-set-derive = { path = "tatara-closed-set-derive", version = "=0.3.53" }

# ── Every other intra-workspace dep, for the SAME reason. ──────────────
#
# These were declared inline in each member's [dependencies] at
# version = "0.2.2" and went stale for three releases, because
# rust-workspace-bump only rewrites pins inside THIS section. The
# 0.2.5 -> 0.3.2 bump then broke the workspace outright:
#
#   error: failed to select a version for the requirement
#          `tatara-cilium = "^0.2.2"`
#
# 31 pins across 15 crates, all reading "0.2.2". The bumper's own header
# predicted exactly this ("bump-type: minor and major already break the
# pins TODAY") and counted 16 of 19 fleet workspaces already stale — this
# workspace was one of them, and the minor bump is what surfaced it.
#
# Caret (not `=`) is correct for these: they are ordinary sibling libs
# with no cross-crate code emission, so a caret keeps accepting the
# bumped version, AND living here means the bumper rewrites them anyway
# so they can no longer drift. The `=` above is reserved for the ONE
# pairing where it is load-bearing (the derive emits ::tatara_lisp:: paths).
#
# monosashi lives here for the same reason, even though it is not a
# `tatara-*` crate: an inline pin in `tatara-lisp-eval/Cargo.toml` is
# exactly the shape that went stale for three releases above, because
# rust-workspace-bump only rewrites pins inside THIS section.
monosashi = { path = "monosashi", version = "0.3.53" }
tatara-lisp = { path = "tatara-lisp", version = "0.3.53" }
tatara-closed-set = { path = "tatara-closed-set", version = "0.3.53" }
tatara-lisp-eval = { path = "tatara-lisp-eval", version = "0.3.53" }
tatara-lisp-lint = { path = "tatara-lisp-lint", version = "0.3.53" }
tatara-lisp-source = { path = "tatara-lisp-source", version = "0.3.53" }
tatara-domain-forge = { path = "tatara-domain-forge", version = "0.3.53" }
tatara-platform-checks = { path = "tatara-platform-checks", version = "0.3.53" }
tatara-env = { path = "tatara-env", version = "0.3.53" }
tatara-ebpf = { path = "tatara-ebpf", version = "0.3.53" }
tatara-gateway-api = { path = "tatara-gateway-api", version = "0.3.53" }
tatara-cilium = { path = "tatara-cilium", version = "0.3.53" }
tatara-prometheus-operator = { path = "tatara-prometheus-operator", version = "0.3.53" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[patch.crates-io]
# Collapse the duplicate `tatara-lisp` that caixa-ast (via caixa-fmt, via
# tatara-kanmon's build gate) drags in from crates.io. Without this there are
# two packages named `tatara-lisp` in the graph and `cargo build -p tatara-lisp`
# fails as ambiguous — which it did, unnoticed, between the gate landing and
# this line.
#
# Works because caixa-ast requires `tatara-lisp ^0.3.26`, which this workspace
# satisfies. If it ever pins an exact older version the patch silently stops
# applying and the duplicate returns; the symptom is the ambiguity error again,
# NOT a wrong build, and `-p tatara-lisp@<version>` is the fallback spec.
#
# Note the lock does not re-resolve on its own after a workspace version bump —
# it kept a stale 0.3.27 entry until `cargo update caixa-ast` was run.
tatara-lisp = { path = "tatara-lisp" }
