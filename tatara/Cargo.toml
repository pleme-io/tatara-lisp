[package]
name = "tatara"
description = "tatara — umbrella CLI: fmt, lint, run, test, deploy. Drives feira for static checks, tatara-script for execution, wasm-platform for deploy."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
tatara-lisp.workspace = true
tatara-lisp-eval.workspace = true
tatara-lisp-source.workspace = true
tatara-domain-forge.workspace = true
tatara-platform-checks.workspace = true
# Catalog crates the CLI registers when running `tatara checks`,
# so the platform invariants run against the live registry.
tatara-ebpf.workspace = true
tatara-gateway-api.workspace = true
tatara-cilium.workspace = true
tatara-prometheus-operator.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
blake3 = "1.5"

[[bin]]
name = "tatara"
path = "src/main.rs"
