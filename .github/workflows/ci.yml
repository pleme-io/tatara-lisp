name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # NOT `--no-build`. `nix flake check` only ever BUILDS
      # `checks.<system>.*`; everything else (packages/devShells/apps) it
      # merely evaluates. So `--no-build` reduced this step to a pure
      # evaluation pass and skipped the two derivations that carry real
      # verdicts: `checks.build` (the shipped tatara-lisp artifact compiles)
      # and `checks.gen-confirm` (the committed Cargo.gen.lock delta still
      # matches what `gen` derives from Cargo.lock).
      - name: Flake check
        run: nix flake check -L

      - name: Build tatara-script
        run: nix build .#tatara-script -L

      - name: Smoke test tatara-script
        run: |
          echo '(print-line "hello from ci")' > /tmp/smoke.tlisp
          ./result/bin/tatara-script /tmp/smoke.tlisp
