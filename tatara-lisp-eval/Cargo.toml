[package]
name = "tatara-lisp-eval"
description = "Runtime evaluator for tatara-lisp — embeddable Scheme-ish eval scoped to orchestration (job queues, rules, REPL). See docs/eval-design.md."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# The shared strictness vocabulary, consumed by `src/strictness.rs`. A LEAF
# with no dependencies of its own (see monosashi/Cargo.toml), so this edge
# adds nothing to any consumer's graph but the vocabulary itself — and it is
# the same vocabulary `blue` reads, which is the point: two lisps reporting
# one reading rather than two that are free to disagree.
monosashi.workspace = true
tatara-lisp.workspace = true
# The closed-set TRAIT, for its generic `find_by_label` /
# `contains_label` projections. `src/type_check.rs` decodes the seven
# `NumericWidth` type keywords through them instead of re-deriving the
# `ALL.iter().find(|w| w.label() == name)` sweep at the call site. A
# LEAF crate that `tatara-lisp` already depends on, so this edge adds
# nothing to any consumer's graph.
tatara-closed-set.workspace = true
thiserror = "2"
# The persistent vector and HAMT behind `Value::List` / `Value::Map`, wrapped by
# `src/persist.rs` so no consumer names it. Pure Rust.
imbl = "7"

# Host-stack growth for the tree-walker's nested closure calls — see
# `eval::call_closure`. Switching stacks is irreducibly below safe Rust:
# stacker's `psm` is a few hundred lines of per-architecture assembly, the
# lowest layer there is and one seam, which is the shape CONTAIN THE C asks
# for. Not on wasm, where psm has no target and the engine's stack is the
# module's own; the depth bound is the only guard there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1"
